version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      # react-scripts 5.0.1 declares typescript "^3.2.1 || ^4" as an optional
      # peer. A major bump to 5.x+ desynchronises package-lock.json and breaks
      # `npm ci`. Hold at ^4 until the Vite migration (see CHANGELOG 1.1.0).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
      babel:
        patterns:
          - "@babel/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"
